<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EvOS Anap</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:#000;
    color:white;
    overflow-x:hidden;
    transition:.4s;
}

/* BACKGROUND BINTANG */
.stars{
    position:fixed;
    inset:0;
    z-index:-2;
    overflow:hidden;
    background:#000;
}

.star{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1.3);
    }
}

/* TOGGLE */
.theme{
    position:fixed;
    top:22px;
    right:22px;
    z-index:20;
    width:135px;
    height:70px;
    border-radius:40px;
    background:#242424;
    display:flex;
    align-items:center;
    justify-content:space-around;
    font-size:30px;
    box-shadow:0 5px 25px rgba(255,255,255,.08);
}

.theme button{
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:30px;
}

/* CONTAINER */
.wrapper{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:100px 20px 50px;
}

.card{
    width:100%;
    max-width:625px;
    padding:30px 32px 35px;
    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            rgba(40,40,43,.80),
            rgba(17,17,19,.88)
        );

    box-shadow:
        0 0 50px rgba(255,255,255,.05),
        inset 0 0 25px rgba(255,255,255,.02);

    text-align:center;
}

/* FOTO */
.profile{
    width:180px;
    height:180px;
    margin:0 auto 22px;
    padding:6px;
    border-radius:50%;

    background:linear-gradient(
        135deg,
        #00c6ff,
        #0066ff,
        #8a00ff,
        #ff00d4
    );

    box-shadow:
        0 0 25px rgba(0,150,255,.45),
        0 0 35px rgba(150,0,255,.25);
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
}

/* TEXT */
.welcome{
    font-size:25px;
    font-weight:bold;
    margin-bottom:20px;
    text-shadow:0 0 15px rgba(255,255,255,.2);
}

.welcome span{
    color:#00eaff;
}

.name{
    font-size:31px;
    font-weight:800;
    margin-bottom:8px;
}

.description{
    color:#a7a7b0;
    font-size:22px;
    line-height:1.45;
    margin-bottom:36px;
}

/* BUTTON */
.buttons{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.btn{
    width:100%;
    min-height:78px;
    padding:16px 20px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    background:#fff;
    color:#111;

    border-radius:20px;
    text-decoration:none;

    font-size:23px;
    font-weight:bold;

    position:relative;

    border:3px solid transparent;

    background-image:
        linear-gradient(#fff,#fff),
        linear-gradient(
            90deg,
            #00d9ff,
            #0066ff,
            #9d00ff,
            #ff00c8
        );

    background-origin:border-box;
    background-clip:padding-box,border-box;

    transition:.25s;
}

.btn:hover{
    transform:translateY(-4px) scale(1.01);

    box-shadow:
        0 8px 25px rgba(0,180,255,.25),
        0 8px 25px rgba(180,0,255,.2);
}

.btn:active{
    transform:scale(.97);
}

/* FOOTER */
.footer{
    margin-top:25px;
    color:#777;
    font-size:14px;
}

/* LIGHT MODE */
body.light{
    background:#f1f5f9;
    color:#111;
}

body.light .stars{
    background:#e2e8f0;
}

body.light .star{
    background:#475569;
}

body.light .card{
    background:rgba(255,255,255,.8);
    box-shadow:0 15px 40px rgba(0,0,0,.1);
}

body.light .description{
    color:#64748b;
}

/* HP */
@media(max-width:600px){

    .theme{
        top:20px;
        right:18px;
        width:120px;
        height:60px;
    }

    .theme button{
        font-size:26px;
    }

    .wrapper{
        padding:110px 18px 35px;
    }

    .card{
        padding:28px 25px 30px;
        border-radius:30px;
    }

    .profile{
        width:180px;
        height:180px;
    }

    .welcome{
        font-size:23px;
    }

    .name{
        font-size:30px;
    }

    .description{
        font-size:20px;
    }

    .btn{
        min-height:76px;
        font-size:21px;
    }
}
</style>
</head>

<body>

<!-- BINTANG -->
<div class="stars" id="stars"></div>

<!-- TOMBOL TEMA -->
<div class="theme">
    <button onclick="darkMode()">🌙</button>
    <button onclick="lightMode()">☀️</button>
</div>


<div class="wrapper">

    <main class="card">

        <!-- FOTO PROFIL -->
        <div class="profile">
            <img
                src="https://i.imgur.com/8Km9tLL.jpg"
                alt="Profile">
        </div>


        <!-- JUDUL -->
        <div class="welcome">
            Halo king <span>Hi 👋</span>, selamat datang
        </div>

        <div class="name">
            evos anap
        </div>

        <div class="description">
            anap ganteng idaman stecu ayodl kalian<br>
            top reseller mlbb since 2025
        </div>


        <!-- TOMBOL -->
        <div class="buttons">

            <a
                class="btn"
                href="https://wa.me/6280000000000"
                target="_blank">
                📞 Nomor Admin Utama
            </a>

            <a
                class="btn"
                href="https://chat.whatsapp.com/"
                target="_blank">
                💬 Grup Jual Beli Terbuka
            </a>

            <a
                class="btn"
                href="https://chat.whatsapp.com/"
                target="_blank">
                😹 Grup Stok With Friend
            </a>

            <a
                class="btn"
                href="https://whatsapp.com/channel/"
                target="_blank">
                🥶 Saluran Stok
            </a>

            <a
                class="btn"
                href="#admin">
                🥵 List Admin Saluran
            </a>

        </div>

        <div class="footer">
            © 2026 EvOS Anap
        </div>

    </main>

</div>


<script>

/* MEMBUAT BINTANG */
const stars = document.getElementById("stars");

for(let i=0;i<100;i++){

    const star = document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random()*100 + "%";

    star.style.top =
        Math.random()*100 + "%";

    star.style.width =
        (Math.random()*3+1) + "px";

    star.style.height =
        star.style.width;

    star.style.animationDelay =
        Math.random()*3 + "s";

    stars.appendChild(star);
}


/* DARK MODE */
function darkMode(){
    document.body.classList.remove("light");
}


/* LIGHT MODE */
function lightMode(){
    document.body.classList.add("light");
}

</script>

</body>
</html>
