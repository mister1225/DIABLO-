<!DOCTYPE html>

    <title>DIABLO - Links</title>
    <style>
        /* Pengaturan Dasar */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f0f0f; /* Warna latar hitam pekat */
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Utama */
        .wrapper {
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Nama (DIABLO) */
        h1 {
            font-size: 28px;
            letter-spacing: 4px;
            margin-bottom: 5px;
            color: #e74c3c; /* Warna merah agar terlihat berani */
            text-transform: uppercase;
        }

        /* Deskripsi (WELCOME) */
        .description {
            font-size: 14px;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* Desain Tombol */
        .link-item {
            display: block;
            background-color: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s ease;
            border: 1px solid #333;
        }

        /* Efek saat tombol ditekan */
        .link-item:active {
            transform: scale(0.95);
            background-color: #222;
        }

        /* Tombol WhatsApp (Warna Hijau Khas) */
        .btn-whatsapp {
            border-left: 5px solid #25D366;
        }

        /* Tombol Saluran & Grup */
        .btn-community {
            border-left: 5px solid #3498db;
        }

        /* Footer Kecil */
        .footer {
            margin-top: 50px;
            font-size: 10px;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="wrapper">
